name: Python Text Analyzer Tests

on:
  push:
    paths:
      - "python-text-analyzer/**"
      - ".github/workflows/python-text-analyzer-tests.yml"
  pull_request:
    paths:
      - "python-text-analyzer/**"
      - ".github/workflows/python-text-analyzer-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s python-text-analyzer -p "test_*.py" -v

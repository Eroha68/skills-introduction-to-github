name: Python Text Analyzer Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s python-text-analyzer -p "test_*.py" -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.0"
          args: "check --output-format=github"
          src: "python-text-analyzer"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  required-ci:
    name: Required CI
    if: always()
    needs: [test, lint, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Verify tests, lint, and security analysis
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test matrix did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Ruff lint did not succeed: ${{ needs.lint.result }}"
            exit 1
          fi
          if [ "${{ needs.codeql.result }}" != "success" ]; then
            echo "CodeQL analysis did not succeed: ${{ needs.codeql.result }}"
            exit 1
          fi

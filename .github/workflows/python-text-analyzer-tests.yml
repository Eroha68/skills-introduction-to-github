name: Python Text Analyzer Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s python-text-analyzer -p "test_*.py" -v

  required-ci:
    name: Required CI
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Verify test matrix
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test matrix did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
